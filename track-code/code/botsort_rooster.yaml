# BoT-SORT configuration for tracking four roosters.
# Keep tracker_type unchanged; the remaining values can be tuned after reviewing previews.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.80
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: false
model: auto
